name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck libpam0g-dev
      - name: Check, test, and build
        run: make check
      - name: Verify Arch package metadata
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --env HOME=/tmp
          --volume "$PWD:/src:ro"
          --workdir /src
          archlinux@sha256:412efebb0eeef0ef322ff24ad73f82b1ba2d3b12377db4c5fbe3074c7e7e8678
          make package-metadata
