# Build static TUI binaries and attach them to a GitHub release whenever a
# semantic version tag (vMAJOR.MINOR.PATCH) is pushed. `./tweaks.sh get-tui`
# downloads from here. The manual dispatch builds an existing tag; it exists
# so a release can be produced even when push-event runs are unavailable.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck libpam0g-dev
      - name: Validate release source
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          make check
      - name: Build static binaries
        run: |
          cd tui
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags='-s -w' -o "../tweaks-tui-linux-$arch" .
          done
          cd ..
      - name: Package self-contained releases
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct)
          for arch in amd64 arm64; do
            bash scripts/package-release.sh \
              "$RELEASE_TAG" "$arch" "tweaks-tui-linux-$arch" .
          done
          sha256sum tweaks-tui-linux-* tweaks-for-cachyos-*.tar.gz > SHA256SUMS
          smoke_dir=$(mktemp -d)
          tar -C "$smoke_dir" -xzf "tweaks-for-cachyos-${RELEASE_TAG#v}-linux-amd64.tar.gz"
          "$smoke_dir/tweaks-for-cachyos-${RELEASE_TAG#v}-linux-amd64/build/tweaks-tui" --help
          "$smoke_dir/tweaks-for-cachyos-${RELEASE_TAG#v}-linux-amd64/tweaks.sh" --help
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            tweaks-for-cachyos-*.tar.gz
            tweaks-tui-linux-amd64
            tweaks-tui-linux-arm64
            SHA256SUMS
          generate_release_notes: true
